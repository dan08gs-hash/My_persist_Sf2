
name: Compilar SF2 Player v0.9.5

on:
  workflow_dispatch:
  push:
    paths:
      - 'SF2Player_v0.9.5_ESTAVEL_AUDIO_PERSISTENTE.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: sf2player-build
  cancel-in-progress: true

jobs:
  build:
    name: Gerar APK Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Localizar projeto Android
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="SF2Player_v0.9.5_ESTAVEL_AUDIO_PERSISTENTE.zip"
          ROOT_TEMP="$RUNNER_TEMP/sf2-project"

          if [[ ! -f "$ZIP" ]]; then
            echo "::error::Arquivo ZIP nao encontrado: $ZIP"
            exit 1
          fi

          mkdir -p "$ROOT_TEMP"
          unzip -oq "$ZIP" -d "$ROOT_TEMP"

          mapfile -t FILES < <(
            find "$ROOT_TEMP" \
              -type f -name settings.gradle.kts
          )

          if [[ "${#FILES[@]}" -ne 1 ]]; then
            echo "::error::Estrutura Gradle inesperada."
            printf '%s\n' "${FILES[@]}"
            exit 1
          fi

          ROOT="$(dirname "${FILES[0]}")"

          test -f "$ROOT/app/build.gradle.kts"
          test -f "$ROOT/app/src/main/cpp/CMakeLists.txt"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Projeto encontrado: $ROOT"

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [[ -z "$SDK" || ! -d "$SDK" ]]; then
            echo "::error::Android SDK nao encontrado."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager \
            -print 2>/dev/null | sort -V | tail -n 1)"

          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager nao encontrado."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          java -version
          "$SDKMANAGER" --version

      - name: Instalar SDK NDK e CMake
        shell: bash
        run: |
          set -euo pipefail

          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail

          if [[ "$LICENSE_STATUS" -ne 0 ]]; then
            echo "::error::Falha ao aceitar licencas."
            exit 1
          fi

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

          test -f \
            "$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"

          echo "Android SDK preparado."

      - name: Instalar ferramentas de compilacao
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            git \
            unzip

      - name: Compilar FluidSynth sem GLib2
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="$RUNNER_TEMP/fluidsynth-source"
          BUILD="$RUNNER_TEMP/fluidsynth-build"
          NDK="$ANDROID_HOME/ndk/27.2.12479018"

          git clone \
            --depth 1 \
            --branch v2.5.3 \
            https://github.com/FluidSynth/fluidsynth.git \
            "$SOURCE"

          cmake -S "$SOURCE" -B "$BUILD" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DBUILD_SHARED_LIBS=ON \
            -Dosal=cpp11 \
            -Denable-libinstpatch=OFF \
            -Denable-openmp=OFF \
            -Denable-libsndfile=OFF \
            -Denable-pulseaudio=OFF \
            -Denable-pipewire=OFF \
            -Denable-alsa=OFF \
            -Denable-jack=OFF \
            -Denable-oss=OFF \
            -Denable-portaudio=OFF \
            -Denable-readline=OFF \
            -Denable-dbus=OFF \
            -Denable-network=OFF \
            -Denable-aufile=OFF \
            -Denable-ladspa=OFF \
            -Denable-sdl3=OFF \
            -Denable-native-dls=OFF

          cmake --build "$BUILD" --parallel 2

          echo "Verificando bibliotecas geradas:"
          find "$BUILD" -name 'libfluidsynth*' -print

          LIB="$BUILD/src/libfluidsynth.so"

          if [[ ! -s "$LIB" ]]; then
            echo "::error::FluidSynth nao encontrado em $LIB"
            exit 1
          fi

          mkdir -p \
            app/src/main/jniLibs/arm64-v8a

          mkdir -p \
            app/src/main/cpp/fluidsynth/include

          cp "$LIB" \
            app/src/main/jniLibs/arm64-v8a/libfluidsynth.so

          cp -R "$SOURCE/include/." \
            app/src/main/cpp/fluidsynth/include/

          if [[ ! -s \
            app/src/main/cpp/fluidsynth/include/fluidsynth.h ]]; then
            echo "::error::Cabecalho FluidSynth nao encontrado."
            exit 1
          fi

          echo "FluidSynth ARM64 preparado."
          file app/src/main/jniLibs/arm64-v8a/libfluidsynth.so

      - name: Compilar aplicativo Android
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            clean assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK nao encontrado."
            exit 1
          fi

          echo "APK compilado."
          ls -lh "$APK"

      - name: Verificar bibliotecas nativas
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          unzip -l "$APK" > "$RUNNER_TEMP/apk-list.txt"

          if ! grep -q \
            "lib/arm64-v8a/libfluidsynth.so" \
            "$RUNNER_TEMP/apk-list.txt"; then
            echo "::error::FluidSynth ausente no APK."
            exit 1
          fi

          if ! grep -q \
            "lib/arm64-v8a/libsf2native.so" \
            "$RUNNER_TEMP/apk-list.txt"; then
            echo "::error::Biblioteca SF2 nativa ausente."
            exit 1
          fi

          echo "Bibliotecas ARM64 encontradas."

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SF2Player-v0.9.5-ARM64
          path: ${{ steps.project.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
