
name: Compilar SF2 Player Fase 1

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'SF2Player_Fase1.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: APK Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK e NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-36' 'build-tools;35.0.0' \
            'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extrair e localizar projeto
        shell: bash
        run: |
          set -euo pipefail
          test -f SF2Player_Fase1.zip || { echo 'ZIP SF2Player_Fase1.zip ausente na raiz do repositorio'; exit 1; }
          mkdir -p "$RUNNER_TEMP/sf2-extracted"
          unzip -q SF2Player_Fase1.zip -d "$RUNNER_TEMP/sf2-extracted"
          PROJECT_FILE=$(find "$RUNNER_TEMP/sf2-extracted" -type f -name settings.gradle.kts -print -quit)
          test -n "$PROJECT_FILE" || { echo 'settings.gradle.kts nao encontrado no ZIP'; exit 1; }
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          test -f "$PROJECT_DIR/app/src/main/cpp/sf2native.c"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto localizado em $PROJECT_DIR"

      - name: Compilar FluidSynth 2.5.3 para ARM64
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.5.3 https://github.com/FluidSynth/fluidsynth.git "$RUNNER_TEMP/fluidsynth-src"
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S "$RUNNER_TEMP/fluidsynth-src" -B "$RUNNER_TEMP/fluidsynth-build" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/fluidsynth-install" \
            -Denable-glib=OFF \
            -Denable-libsndfile=OFF \
            -Denable-dbus=OFF \
            -Denable-pulseaudio=OFF \
            -Denable-alsa=OFF \
            -Denable-jack=OFF \
            -Denable-oss=OFF \
            -Denable-coreaudio=OFF \
            -Denable-network=OFF \
            -Denable-readline=OFF \
            -Denable-aufile=OFF \
            -Denable-floats=ON \
            -DDEFAULT_SOUNDFONT='' \
            -Denable-floats=ON
          cmake --build "$RUNNER_TEMP/fluidsynth-build" --parallel 2
          LIB=$(find "$RUNNER_TEMP/fluidsynth-build" -type f -name 'libfluidsynth.so' -print -quit)
          test -n "$LIB" || { echo 'libfluidsynth.so nao gerada'; exit 1; }
          mkdir -p "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a"
          cp "$LIB" "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libfluidsynth.so"
          mkdir -p "$PROJECT_DIR/app/src/main/cpp/fluidsynth/include/fluidsynth"
          cp "$RUNNER_TEMP/fluidsynth-src/include/fluidsynth.h" "$PROJECT_DIR/app/src/main/cpp/fluidsynth/include/"
          cp "$RUNNER_TEMP/fluidsynth-src/include/fluidsynth/"*.h "$PROJECT_DIR/app/src/main/cpp/fluidsynth/include/fluidsynth/"
          if test -f "$RUNNER_TEMP/fluidsynth-build/include/fluidsynth/version.h"; then
            cp "$RUNNER_TEMP/fluidsynth-build/include/fluidsynth/version.h" "$PROJECT_DIR/app/src/main/cpp/fluidsynth/include/fluidsynth/"
          fi
          if test -f "$RUNNER_TEMP/fluidsynth-build/include/fluidsynth.h"; then
            cp "$RUNNER_TEMP/fluidsynth-build/include/fluidsynth.h" "$PROJECT_DIR/app/src/main/cpp/fluidsynth/include/"
          fi
          test -f "$PROJECT_DIR/app/src/main/cpp/fluidsynth/include/fluidsynth/version.h"

      - name: Compilar APK Debug
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verificar bibliotecas no APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libfluidsynth.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libsf2native.so'
          echo "APK gerado: $APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SF2Player-Fase1-ARM64
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
